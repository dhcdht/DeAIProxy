version: '3.8'
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: deapn
      POSTGRES_PASSWORD: deapn_password
      POSTGRES_DB: deapn
    ports:
      - "5432:5432"

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    ports:
      - "8545:8545"
    command: ["anvil", "--host", "0.0.0.0"]
